# Alembic configuration file.
# This file is read by `alembic` CLI commands.
# The actual database URL is read from the environment in alembic/env.py —
# it is NOT hardcoded here.

[alembic]
# Path to migrations directory (relative to this file).
script_location = alembic

# File name template for new migration files.
file_template = %%(rev)s_%%(slug)s

# Timezone for revision dates in filenames.
timezone = UTC

# SQLAlchemy connection URL is set programmatically in alembic/env.py
# from the DATABASE_URL environment variable. Do NOT set sqlalchemy.url here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
